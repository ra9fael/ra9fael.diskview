<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" lang="zh-CN">
<title>磁盘透视控件方案：工具栏、下拉、显示列和取消高亮</title>
<defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px;fill:#243343}.small{font-size:12px;fill:#788391}.title{font-size:22px;font-weight:600}.blue{fill:#087bcc}.panel{fill:#fff;stroke:#dce0e5}.control{fill:#fafbfc;stroke:#d6dbe1}.line{stroke:#e5e8ec;fill:none}</style></defs>
<rect width="1440" height="1100" fill="#eef0f3"/>
<text x="40" y="46" class="title">磁盘透视 · 文件视图与菜单布局</text><text x="40" y="75" class="small">控件高 28 px / 工具栏高 40 px / 间距 8 px · 显示列移入标签栏，表格恢复完整宽度</text>
