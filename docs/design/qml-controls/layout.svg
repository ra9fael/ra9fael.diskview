<rect x="568" y="186" width="180" height="28" rx="4" class="control"/><text x="580" y="205">匹配：包含文字　⌄</text>
<text x="64" y="246" class="small">名称 ↓</text><text x="886" y="246" class="small">大小</text><text x="1020" y="246" class="small">已分配</text><text x="1146" y="246" class="small">修改时间</text><text x="1342" y="246" class="small">属性</text>
