<text x="64" y="311">archive.zip</text><text x="886" y="311">18.2 GB</text><text x="1020" y="311">18.2 GB</text><text x="1146" y="311">2026/10/09</text><text x="1342" y="311">A</text>
<rect x="41" y="330" width="1358" height="5" fill="#d3d9e0"/><text x="64" y="360">可视化视图</text>
<rect x="1090" y="341" width="180" height="28" rx="4" fill="#e7f2fc" stroke="#c1dff5"/><text x="1102" y="360" class="blue">高亮：.mp4　　 ×</text><text x="1292" y="360">层级：自动 ⌄</text>
<rect x="52" y="379" width="680" height="125" rx="2" fill="#667fc1" stroke="#087bcc" stroke-width="3"/><text x="68" y="405" fill="white" style="fill:white">录屏视频 .mp4 · 53.6 GB</text><rect x="736" y="379" width="395" height="125" rx="2" fill="#bad9d0"/><rect x="1135" y="379" width="249" height="125" rx="2" fill="#e2d7c2"/>
<text x="40" y="560" font-weight="600">范围菜单</text><text x="390" y="560" font-weight="600">匹配菜单</text><text x="740" y="560" font-weight="600">显示列菜单</text><text x="1090" y="560" font-weight="600">预设布局菜单</text>
<rect x="40" y="578" width="320" height="178" rx="4" class="control"/>
<rect x="45" y="583" width="310" height="52" rx="3" fill="#e8f0f7"/><text x="55" y="605">✓　当前目录</text><text x="83" y="626" class="small">只列出当前目录中的文件</text><text x="83" y="657">当前目录及子目录</text><text x="83" y="678" class="small">也列出下级目录中的文件</text><text x="83" y="709">整个扫描</text><text x="83" y="730" class="small">列出本次扫描中的全部文件</text>
<rect x="390" y="578" width="320" height="126" rx="4" class="control"/><text x="405" y="605">✓　包含文字</text><text x="433" y="626" class="small">按名称或路径查找</text><text x="433" y="657">模糊匹配</text><text x="433" y="678" class="small">按文件名中的字符顺序查找</text>
<rect x="740" y="578" width="320" height="257" rx="4" class="control"/><text x="754" y="603" class="small">文件视图 · 显示列</text><text x="754" y="637">☑　名称（始终显示）</text><text x="754" y="669">☑　大小</text><text x="754" y="701">☑　已分配</text><text x="754" y="733">☑　修改时间</text><text x="754" y="765">☐　属性</text><path d="M746 782H1054" class="line"/><text x="754" y="810">恢复默认列</text>
<rect x="1090" y="578" width="310" height="145" rx="4" class="control"/><text x="1105" y="605">✓　列表在上，图表在下</text><text x="1133" y="637">列表在下，图表在上</text><text x="1133" y="669">列表在左，图表在右</text><text x="1133" y="701">列表在右，图表在左</text>
<text x="40" y="800" class="small">多选列时菜单保持打开；点击外部 / Esc 关闭。</text><text x="40" y="824" class="small">表头右键打开同一菜单，不额外占用表格列。</text>
<rect x="40" y="860" width="640" height="200" rx="6" class="panel"/><text x="60" y="891" font-weight="600">未能移入回收站</text><text x="60" y="922" class="small">2026-10-10 19-45-40.mp4 · 53.6 GB</text><text x="60" y="953">Windows 未完成回收，文件仍在原位置。</text><text x="60" y="982" class="small">可重试，或在资源管理器中检查。技术详情按需展开。</text><rect x="490" y="1010" width="76" height="28" rx="4" class="control"/><text x="513" y="1029">重试</text><rect x="576" y="1010" width="76" height="28" rx="4" class="control"/><text x="599" y="1029">关闭</text>
<text x="740" y="901" font-weight="600">取消扩展名高亮</text><text x="740" y="935">图表常驻“高亮：扩展名 ×”，一键清除。</text><text x="740" y="966">扩展名视图提供“清除选择”，再次点击已选项也取消。</text><text x="740" y="1009" class="small">窄面板：工具栏按组换行，控件不压缩省略。</text><text x="740" y="1038" class="small">图标实现复用现有 Phosphor 入口。</text>
</svg>
