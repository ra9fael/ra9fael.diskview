<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁盘透视 · 控件交互稿</title>
<script type="module">
if (!Object.hasOwn(HTMLElement.prototype, 'popover')) {
  await import('https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js');
}
</script>
<style>
:root{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;color:#243343;background:#eef0f3;--line:#dce0e5;--blue:#087bcc;--surface:#fff;--hover:#edf4fa}
*{box-sizing:border-box}body{margin:24px}h1{font-size:19px;margin:0 0 6px}p{color:#66717e;line-height:1.6}.intro{margin:0 0 18px}button,input{font:inherit;color:inherit}button{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:4px;height:28px;padding:0 10px;white-space:nowrap}button:hover{background:var(--hover)}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{background:#fff;border:1px solid #ccd2d9;border-radius:6px;overflow:clip;max-width:1280px}.top,.tabs,.tools,.chartbar,.status{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#fafbfc}.path{flex:1;min-width:80px}.spacer{flex:1}.tabs{padding-block:3px;height:34px}.tabs>button{border-color:transparent;background:transparent;color:#6d7680}.tabs>button[aria-selected=true]{color:var(--blue);background:#edf4fa}.tools{flex-wrap:wrap;min-height:40px}.tools search{flex:0 1 300px;min-width:190px;position:relative}input[type=search]{height:28px;width:100%;border:1px solid var(--line);border-radius:4px;padding:0 9px}.tablewrap{overflow:auto;min-height:218px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{font-weight:400;text-align:right;padding:7px 12px;border-bottom:1px solid #edf0f3}th{color:#75808c;background:#fcfcfd}th:first-child,td:first-child{text-align:left}tr.selected{background:#eaf3fb;box-shadow:inset 3px 0 var(--blue)}.muted{color:#79838e}.divider{height:5px;background:#d3d9e0}.chartbar{min-height:38px}.chip{background:#e7f2fc;color:#056cae;border-color:#c1dff5}.chart{display:grid;grid-template-columns:3fr 2fr 1.3fr;gap:3px;padding:8px;height:200px}.tile{height:auto;border:0;border-radius:2px;color:white;text-align:left;display:flex;align-items:flex-start;padding:12px;background:#667fc1}.tile:nth-child(2){background:#57a18c}.tile:nth-child(3){background:#ad9763}.chart.highlight .tile:not(.active){opacity:.32}.tile.active{outline:3px solid #0584e3;outline-offset:-3px}.status{font-size:12px;color:#6d7782;border:0}.menu{position:fixed;inset:auto;margin:0;background:#fafbfc;color:#243343;border:1px solid #d6dbe1;border-radius:4px;padding:4px;min-width:230px;max-width:calc(100vw - 24px);box-shadow:0 4px 14px #20304018}.menu button{display:block;border:0;background:transparent;text-align:left;width:100%;height:32px;padding:0 10px}.menu button:hover,.menu label:hover{background:#e8f0f7;border-radius:3px}.menu small{display:block;color:#77818d;font-size:11px}.menu .explain{height:48px}.menu label{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer}.menu input{accent-color:var(--blue)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px}.menu header{font-size:12px;color:#788391;padding:7px 10px}.menu b{font-weight:400;color:var(--blue)}dialog{width:min(480px,calc(100vw - 32px));border:1px solid #ccd2d9;border-radius:7px;padding:22px;box-shadow:0 12px 50px #0003}dialog::backdrop{background:#1b293b55}dialog h2{font-size:17px;margin:0 0 16px}.warning{color:#a34325;background:#fff5ef;padding:12px;border-radius:4px}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}details{margin-top:16px;font-size:12px;color:#74808c}.scenarios{display:flex;flex-wrap:wrap;gap:10px;max-width:1280px;margin-top:18px}.hidden{display:none!important}@media(max-width:700px){body{margin:12px}.top{flex-wrap:wrap}.tools search{flex-basis:100%}.top .path{min-width:60%}.chart{height:160px}.tabs{gap:0}.tabs button{padding-inline:6px}}
</style>
<h1>磁盘透视 · 控件交互稿</h1>
<p class="intro">可点击各下拉菜单、切换列表、搜索、显示列、选择扩展名并取消高亮。下方可预览大文件回收反馈。</p>
<main class="app">
<header class="top"><button data-menu="drives" id="drive">C: (C:) ▾</button><button class="path">C:\Users\renfei\Videos</button><button>扫描</button><button data-menu="layouts">预设布局 ▾</button></header>
<nav class="tabs" aria-label="列表视图"><button data-tab="tree" aria-selected="false">树视图</button><button data-tab="files" aria-selected="true">文件视图</button><button data-tab="ext" aria-selected="false">扩展名视图</button><span class="spacer"></span><button id="clear-ext" class="hidden">清除选择</button><button data-menu="columns" aria-label="显示和隐藏列">显示列 ▾</button></nav>
<div class="tools" id="filetools"><search><input id="query" type="search" aria-label="搜索文件名或路径" placeholder="搜索文件名或路径…"></search><button id="scope" data-menu="scopes">范围：当前目录 ▾</button><button id="match" data-menu="matches">匹配：包含文字 ▾</button></div>
<div class="tablewrap"><table><thead><tr id="heads"></tr></thead><tbody id="rows"></tbody></table></div>
<div class="divider"></div><div class="chartbar"><span>可视化视图</span><span class="spacer"></span><button id="chip" class="chip hidden" aria-label="取消扩展名高亮">高亮：.mp4 ×</button><button data-menu="depths">层级：自动 ▾</button></div>
<div class="chart" id="chart"><button class="tile" data-ext=".mp4">录屏视频 .mp4<br>53.6 GB</button><button class="tile" data-ext=".zip">归档文件 .zip<br>18.2 GB</button><button class="tile" data-ext=".jpg">图片 .jpg<br>2.4 GB</button></div><footer class="status" id="status" aria-live="polite">当前目录 · 3 个文件 · 74.2 GB</footer>
</main>
<div id="drives" class="menu" popover><button data-drive="C: (C:)">✓　C: (C:)　<b>1011.4 GB</b> 可用 / 1862.0 GB</button><button data-drive="NVME (D:)">　 NVME (D:)　<b>999.0 GB</b> 可用 / 1862.7 GB</button><button data-drive="HDD (E:)">　 HDD (E:)　<b>405.7 GB</b> 可用 / 931.5 GB</button></div>
<div id="layouts" class="menu" popover><button data-layout>✓　列表在上，图表在下</button><button data-layout>　 列表在下，图表在上</button><button data-layout>　 列表在左，图表在右</button><button data-layout>　 列表在右，图表在左</button></div>
<div id="scopes" class="menu" popover><button data-scope="当前目录" class="explain">✓　当前目录<small>　　只列出当前目录中的文件</small></button><button data-scope="当前目录及子目录" class="explain">　 当前目录及子目录<small>　　也列出下级目录中的文件</small></button><button data-scope="整个扫描" class="explain">　 整个扫描<small>　　列出本次扫描中的全部文件</small></button></div>
<div id="matches" class="menu" popover><button data-match="包含文字" class="explain">✓　包含文字<small>　　按名称或路径查找</small></button><button data-match="模糊匹配" class="explain">　 模糊匹配<small>　　按文件名中的字符顺序查找</small></button></div>
<div id="columns" class="menu" popover><header id="coltitle">文件视图 · 显示列</header><label><input type="checkbox" checked disabled>名称（始终显示）</label><div id="checks"></div><hr><button id="reset">恢复默认列</button></div>
<div id="depths" class="menu" popover><button data-depth="自动">✓　自动</button><button data-depth="2 层">　 2 层</button><button data-depth="3 层">　 3 层</button></div>
<section class="scenarios" aria-label="错误反馈预览"><button id="recycle">预览：回收未完成</button><button id="capacity">预览：已确认容量不足</button><span class="muted">仅模拟界面，不操作真实文件</span></section>
<dialog id="error" aria-labelledby="error-title"><h2 id="error-title">未能移入回收站</h2><p>2026-10-10 19-45-40.mp4 · 53.6 GB</p><p class="warning" id="reason">Windows 未完成回收，文件仍在原位置。</p><p id="advice">可以重试，或在资源管理器中检查该文件。</p><details><summary>技术详情</summary><p>操作：移至回收站<br>结果：操作已中止，未确认可恢复目标<br>Shell 单项状态：0x00270008</p></details><footer><button id="retry">重试</button><form method="dialog"><button>关闭</button></form></footer></dialog>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const labels=['大小','已分配','修改时间','属性'];const visible=new Set(labels);let tab='files',highlight='',scope='当前目录',mode='包含文字';
const files=[['2026-10-10 19-45-40.mp4','53.6 GB','53.6 GB','2026/10/10','A'],['archive.zip','18.2 GB','18.2 GB','2026/10/09','A'],['photo.jpg','2.4 GB','2.4 GB','2026/10/08','A']];
function render(){const ext=tab==='ext';$('#heads').replaceChildren(...[ext?'扩展名':'名称',...labels.filter(x=>visible.has(x))].map(t=>{const e=document.createElement('th');e.textContent=t;return e}));$('#rows').replaceChildren();files.filter(row=>{const q=$('#query').value.toLowerCase();return !q||(mode==='包含文字'?('C:\\Users\\renfei\\Videos\\'+row[0]).toLowerCase().includes(q):[...q].reduce((i,c)=>i<0?-1:row[0].toLowerCase().indexOf(c,i)+1||-1,0)>=0)}).forEach(row=>{const tr=document.createElement('tr');let extension='.'+row[0].split('.').pop();if(highlight===extension)tr.className='selected';[ext?extension:row[0],...row.slice(1).filter((_,i)=>visible.has(labels[i]))].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});tr.addEventListener('click',()=>setHighlight(highlight===extension?'':extension));$('#rows').append(tr)});$('#chip').classList.toggle('hidden',!highlight);$('#chip').textContent='高亮：'+highlight+' ×';$('#clear-ext').classList.toggle('hidden',tab!=='ext'||!highlight);$('#chart').classList.toggle('highlight',!!highlight);$$('.tile').forEach(e=>e.classList.toggle('active',e.dataset.ext===highlight));$('#filetools').classList.toggle('hidden',tab!=='files');$('#coltitle').textContent=({tree:'树视图',files:'文件视图',ext:'扩展名视图'})[tab]+' · 显示列';}
function setHighlight(v){highlight=v;render()}
labels.forEach(t=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.addEventListener('change',()=>{c.checked?visible.add(t):visible.delete(t);render()});l.append(c,t);$('#checks').append(l)});
$$('[data-menu]').forEach(b=>{const p=document.getElementById(b.dataset.menu);b.setAttribute('popovertarget',p.id);p.addEventListener('beforetoggle',e=>{if(e.newState!=='open')return;const r=b.getBoundingClientRect();p.style.left=Math.max(8,Math.min(r.left,innerWidth-360))+'px';p.style.top=(r.bottom+4)+'px'})});
function choice(attr,fn){$$('['+attr+']').forEach(b=>b.addEventListener('click',()=>{fn(b);b.closest('[popover]').hidePopover();document.querySelector('[data-menu="'+b.closest('[popover]').id+'"]').focus()}))}
choice('data-drive',b=>$('#drive').textContent=b.dataset.drive+' ▾');choice('data-scope',b=>{scope=b.dataset.scope;$('#scope').textContent='范围：'+scope+' ▾';$$('[data-scope]').forEach(x=>x.firstChild.textContent=(x===b?'✓　':'　 ')+x.dataset.scope);$('#status').textContent='文件范围：'+scope;render()});choice('data-match',b=>{mode=b.dataset.match;$('#match').textContent='匹配：'+mode+' ▾';$$('[data-match]').forEach(x=>x.firstChild.textContent=(x===b?'✓　':'　 ')+x.dataset.match);render()});choice('data-layout',b=>{$$('[data-layout]').forEach(x=>x.textContent=(x===b?'✓　':'　 ')+x.textContent.replace(/^[✓\s]+/,''));$('#status').textContent='预设：'+b.textContent.replace('✓','').trim()});choice('data-depth',b=>$('#status').textContent='图表层级：'+b.dataset.depth);
$$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));render()}));$('#query').addEventListener('input',render);$('#chip').addEventListener('click',()=>{setHighlight('');$('.chartbar [data-menu]').focus()});$('#clear-ext').addEventListener('click',()=>setHighlight(''));$$('.tile').forEach(b=>b.addEventListener('click',()=>setHighlight(highlight===b.dataset.ext?'':b.dataset.ext)));$('#reset').addEventListener('click',()=>{labels.forEach(t=>visible.add(t));$$('#checks input').forEach(c=>c.checked=true);render()});
function error(cap){$('#reason').textContent=cap?'此文件超过该磁盘回收站当前可接收的容量，文件仍在原位置。':'Windows 未完成回收，文件仍在原位置。';$('#advice').textContent=cap?'请先调整回收站容量，再重试。永久删除需要从文件菜单另行确认。':'可以重试，或在资源管理器中检查该文件。';$('#error details').classList.toggle('hidden',cap);$('#error').showModal()}$('#recycle').addEventListener('click',()=>error(false));$('#capacity').addEventListener('click',()=>error(true));$('#retry').addEventListener('click',()=>{$('#advice').textContent='交互稿：已发起重试，未操作真实文件。'});render();
</script>
</html>
