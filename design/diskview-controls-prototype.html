</head><body><main>
<div id="diskview-next" data-pane="chart" aria-label="Disk View 导航与操作改进原型">
<style>
#diskview-next{--bg:light-dark(#f4f7fb,#171d27);--panel:light-dark(#fff,#222a36);--text:light-dark(#203047,#edf2fa);--sub:light-dark(#596a80,#b7c5d8);--line:light-dark(#dbe3ee,#435168);--soft:light-dark(#eaf2fd,#2e4562);--accent:light-dark(#085bb5,#9cc9ff);--on:light-dark(#fff,#142d49);--button:light-dark(#0968cd,#a2cdff);--warn:light-dark(#805116,#ffda9b);--warnbg:light-dark(#fff4dd,#3c3222);--good:light-dark(#146744,#96d9b9);--green:light-dark(#d8eae4,#32564c);--purple:light-dark(#e9e0f4,#4b3e5e);--blue:light-dark(#dce9f8,#304e70);--gold:light-dark(#efe6d1,#5c5139);--gray:light-dark(#e5e9ef,#3b4655);font:13px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;color:var(--text);color-scheme:light dark;width:100%;position:relative;text-align:left}
#diskview-next *{box-sizing:border-box}#diskview-next [hidden]{display:none!important}
#diskview-next button,#diskview-next input,#diskview-next select{font:inherit;color:inherit}
#diskview-next button{cursor:var(--cursor-interaction,pointer)}#diskview-next button:disabled{cursor:default;opacity:.45}
#diskview-next button:focus-visible,#diskview-next input:focus-visible,#diskview-next select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#diskview-next button{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 10px;min-height:32px}
#diskview-next button:hover:not(:disabled){background:var(--soft)}
#diskview-next button[aria-pressed=true],#diskview-next .primary{background:var(--button);color:var(--on);border-color:transparent}
#diskview-next button[aria-pressed=true]:hover,#diskview-next .primary:hover{background:var(--button);color:var(--on)}
#diskview-next .plain{border-color:transparent;background:transparent}
#diskview-next .app{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#diskview-next .titlebar{display:flex;align-items:center;gap:9px;background:var(--panel);padding:10px 14px;flex-wrap:wrap}
#diskview-next .brand{font-size:15px;font-weight:600}
#diskview-next .badge{font-size:11px;background:var(--soft);color:var(--accent);border-radius:5px;padding:3px 7px;white-space:nowrap}
#diskview-next .spacer{flex:1}#diskview-next .muted{color:var(--sub)}#diskview-next .tiny{font-size:11px}
#diskview-next .navline{display:flex;gap:6px;align-items:center;padding:12px 14px 6px;flex-wrap:wrap}
#diskview-next .history{display:flex;gap:4px}
#diskview-next .address{display:flex;gap:2px;align-items:center;flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
#diskview-next .crumbs{display:flex;align-items:center;min-width:0;flex:1;overflow:hidden}
#diskview-next .crumbs button{border:0;background:transparent;white-space:nowrap;max-width:180px;text-overflow:ellipsis;overflow:hidden;padding:4px 6px;min-height:28px}
#diskview-next .crumbs button:last-child{color:var(--accent)}
#diskview-next .crumbs span{color:var(--sub)}
#diskview-next input,#diskview-next select{background:var(--panel);border:1px solid var(--line);padding:7px 9px;border-radius:5px;min-width:0}
#diskview-next #nx-address{width:100%;border:0}
#diskview-next .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 14px 10px;color:var(--sub);font-size:12px}
#diskview-next .meta button{font-size:12px;min-height:26px;padding:3px 7px}
#diskview-next .heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 14px 12px}
#diskview-next .heading h1{font-size:21px;line-height:1.3;margin:0;overflow-wrap:anywhere}
#diskview-next .heading .back-parent{font-weight:600;background:var(--soft);color:var(--accent);border-color:var(--line);min-height:38px}
#diskview-next .heading small{color:var(--sub);font-weight:400;font-size:12px}
#diskview-next .banner{margin:0 14px 10px;border-left:3px solid var(--warn);padding:9px 11px;background:var(--warnbg);color:var(--warn);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#diskview-next .banner span{flex:1;min-width:180px}
#diskview-next .progressbox{margin:0 14px 12px;padding:12px;background:var(--soft);border-radius:7px}
#diskview-next .progressline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#diskview-next .phases{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

#diskview-next .phase.active{color:var(--accent);font-weight:600}
#diskview-next .track{height:4px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:2px;margin-top:10px;overflow:hidden}
#diskview-next .track span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#diskview-next .mobile{display:none;gap:6px;padding:0 14px 10px}
#diskview-next .main{display:grid;grid-template-columns:minmax(0,var(--split,57%)) 6px minmax(0,1fr);margin:0 14px;gap:0;align-items:stretch}
#diskview-next .pane{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}
#diskview-next .paneheader{padding:10px 12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#diskview-next .paneheader strong{font-weight:600}
#diskview-next .paneheader button{padding:4px 8px}
#diskview-next .focus-label{font-size:11px;color:var(--sub)}
#diskview-next .charttools{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:9px 11px}
#diskview-next .charttools select{padding:5px;font-size:12px}
#diskview-next .charttools button{min-width:30px;padding:3px 8px}
#diskview-next .stage{height:355px;position:relative;overflow:hidden;margin:0 10px 6px;background:var(--bg);border-radius:5px;touch-action:none}
#diskview-next .scene{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}

#diskview-next .tile{position:absolute;border:2px solid var(--panel);background:var(--tile);padding:6px;text-align:left;overflow:hidden;border-radius:0;display:flex;align-items:flex-start;flex-direction:column;justify-content:flex-start;min-height:0}
#diskview-next .tile:hover,#diskview-next .tile.selected{color:var(--text);background:var(--tile)!important;box-shadow:inset 0 0 0 2px var(--accent)}
#diskview-next .sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#diskview-next .tile span{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#diskview-next .tile small{color:var(--sub);font-size:11px}
#diskview-next .sun{width:100%;height:100%;display:block}
#diskview-next .sun path{fill:var(--tile);stroke:var(--panel);stroke-width:1;cursor:pointer}
#diskview-next .sun path.selected,#diskview-next .sun path:hover{stroke:var(--accent);stroke-width:2}
#diskview-next .arc-label{position:absolute;transform:translate(-50%,-50%);background:transparent;border:0;padding:1px 4px;min-height:24px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
#diskview-next .arc-label:hover,#diskview-next .arc-label.selected{background:var(--soft)}
#diskview-next .arc-label[aria-pressed=true],#diskview-next .arc-label[aria-pressed=true]:hover{background:var(--soft);color:var(--text)}
#diskview-next .sun-parent{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:114px;border:0;background:transparent;padding:5px;display:flex;flex-direction:column;align-items:center}
#diskview-next .sun-parent span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#diskview-next .sun-parent small{font-size:11px;color:var(--sub)}
#diskview-next .chartnav{display:flex;align-items:center;gap:8px;margin:2px 11px 6px;color:var(--sub);font-size:11px;flex-wrap:wrap}
#diskview-next .panpad{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
#diskview-next .panpad button{width:28px}
#diskview-next .panpad button{padding:0;min-height:27px;border:0}
#diskview-next .panpad button:first-child{grid-column:2}
#diskview-next .panpad [data-pan=up]{grid-area:1/2}#diskview-next .panpad [data-pan=left]{grid-area:2/1}#diskview-next .panpad .pan-center{grid-area:2/2}#diskview-next .panpad [data-pan=right]{grid-area:2/3}#diskview-next .panpad [data-pan=down]{grid-area:3/2}
#diskview-next .panpad .pan-center{font-size:11px}
#diskview-next .legend{padding:5px 11px 9px;display:flex;gap:11px;align-items:center;font-size:11px;color:var(--sub);flex-wrap:wrap}
#diskview-next .legend i{display:inline-block;width:8px;height:8px;background:var(--tile);margin-right:4px}
#diskview-next .splitter{cursor:col-resize;background:transparent}
#diskview-next .listtools{display:flex;gap:5px;padding:10px 11px}
#diskview-next .listtools input{width:100%;font-size:12px}
#diskview-next .filetable{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
#diskview-next .filetable th{font-weight:400;color:var(--sub);text-align:left;border-bottom:1px solid var(--line);padding:4px 9px}
#diskview-next .filetable th:nth-child(2){width:80px;text-align:right}
#diskview-next .filetable th:nth-child(3){width:54px;text-align:right}
#diskview-next .filetable th button{border:0;background:transparent;padding:0;min-height:25px;font-size:12px}
#diskview-next .filetable td{border-bottom:1px solid var(--line);height:38px}
#diskview-next .filetable td:not(:first-child){text-align:right;padding-right:9px;font-variant-numeric:tabular-nums}
#diskview-next .rowbutton{display:flex;align-items:center;gap:7px;width:100%;min-width:0;text-align:left;border:0;border-radius:0;background:transparent;padding:7px 10px}
#diskview-next .rowbutton span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#diskview-next .rowbutton i{width:8px;height:8px;flex:none;background:var(--tile)}
#diskview-next tr.selected{background:var(--soft)}
#diskview-next .parentrow button{color:var(--accent);background:var(--soft);font-weight:600}
#diskview-next .listfoot{padding:9px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--sub);font-size:11px}
#diskview-next .listfoot button{font-size:11px;min-height:27px;padding:3px 7px}
#diskview-next .details{margin:11px 14px 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
#diskview-next .detailbody{flex:1;min-width:180px}
#diskview-next .detailbody strong{font-weight:600;overflow-wrap:anywhere}
#diskview-next .detailpath{color:var(--sub);font-size:12px;margin:3px 0;overflow-wrap:anywhere}
#diskview-next .detailactions{display:flex;gap:5px;flex-wrap:wrap;max-width:240px}
#diskview-next .status{display:flex;gap:10px;align-items:center;padding:8px 14px;color:var(--sub);font-size:11px;min-height:34px}
#diskview-next .status #nx-status{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#diskview-next .helpstrip{padding:0 14px 10px;display:flex;gap:12px;align-items:center;color:var(--sub);font-size:11px;flex-wrap:wrap}
#diskview-next kbd{font:11px "Segoe UI",sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 4px;white-space:nowrap;color:var(--sub)}
#diskview-next .demo{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 10px 4px;color:var(--sub);font-size:12px;background:var(--bg)}
#diskview-next .demo button{padding:4px 8px;min-height:28px;font-size:12px}
#diskview-next .toast{min-height:23px;padding:6px 10px;color:var(--accent);font-size:12px;background:var(--bg)}
#diskview-next .tip{position:absolute;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:10px;width:310px;max-width:calc(100% - 20px);box-shadow:0 6px 24px #0002}
#diskview-next .tip strong{font-weight:600;overflow-wrap:anywhere}
#diskview-next .tip p{margin:4px 0;color:var(--sub);overflow-wrap:anywhere;font-size:12px}
#diskview-next .menu{position:absolute;z-index:40;width:264px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px #0003;padding:5px}
#diskview-next .menu .menuhead{padding:5px 9px;color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#diskview-next .menu button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:4px;background:transparent;padding:6px 9px}
#diskview-next .menu button span{flex:1}
#diskview-next .menu hr{border:0;border-top:1px solid var(--line);margin:4px}
#diskview-next .menu .danger{color:var(--warn)}
#diskview-next .shade{position:absolute;inset:0;z-index:50;background:#101d3059;display:flex;justify-content:center;align-items:flex-start;padding:60px 14px 24px}
#diskview-next .dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:100%;width:590px;box-shadow:0 15px 45px #0003}
#diskview-next .dialoghead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#diskview-next .dialog h2{font-size:18px;font-weight:600;margin:0;flex:1}
#diskview-next .dialog h3{font-size:13px;font-weight:600;margin:14px 0 6px}
#diskview-next .dialog p{margin:8px 0;color:var(--sub);overflow-wrap:anywhere}
#diskview-next .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#diskview-next .fields label{display:flex;gap:5px;flex-direction:column;font-size:12px;min-width:0}
#diskview-next .fields select{width:100%;max-width:100%}
#diskview-next .fields label.full{grid-column:1/-1}
#diskview-next .dialogactions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
#diskview-next .notice{background:var(--soft);padding:9px 11px;border-radius:6px;color:var(--sub);font-size:12px}
#diskview-next .keygrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12px}
#diskview-next .keygrid div{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
#diskview-next .commands{display:flex;flex-direction:column;margin-top:10px}
#diskview-next .commands button{display:flex;align-items:center;gap:9px;text-align:left;border:0}
#diskview-next .commands button span{flex:1;min-width:0;overflow-wrap:anywhere}
#diskview-next .commands button small{max-width:65%;overflow-wrap:anywhere}
#diskview-next .inspector{margin:0 14px 11px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:7px}
#diskview-next .inspector .inspecthead{display:flex;align-items:center;gap:8px;font-weight:600}
#diskview-next .inspector p{font-size:12px;color:var(--sub);margin:6px 0}
#diskview-next .inspector table{width:100%;border-collapse:collapse;font-size:12px}
#diskview-next .inspector td{padding:5px 8px;border-bottom:1px solid var(--line)}
#diskview-next .workers{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
#diskview-next .workers span{background:var(--soft);border-radius:3px;padding:3px 8px;font-size:11px;color:var(--accent)}
#diskview-next .copybox{width:100%;margin-top:10px}
@media(max-width:760px){#diskview-next .main{display:block}#diskview-next .splitter{display:none}#diskview-next .mobile{display:flex}#diskview-next[data-pane=chart] .listpane{display:none}#diskview-next[data-pane=list] .chartpane{display:none}#diskview-next .stage{height:345px}#diskview-next .heading h1{font-size:18px}#diskview-next .detailactions{max-width:none}#diskview-next .status .keyhint{display:none}}
@media(max-width:440px){#diskview-next .navline .address{order:3;flex-basis:100%}#diskview-next .brand-sub{display:none}#diskview-next .titlebar{padding:10px}#diskview-next .titlebar .badge{font-size:11px}#diskview-next .titlebar button{padding:4px 6px}#diskview-next .heading{gap:7px}#diskview-next .heading .back-parent{width:100%;text-align:left}#diskview-next .heading .spacer{display:none}#diskview-next .main,#diskview-next .details{margin-left:10px;margin-right:10px}#diskview-next .stage{height:310px}#diskview-next .keygrid,#diskview-next .fields{grid-template-columns:1fr}#diskview-next .shade{padding:25px 8px}#diskview-next .dialog{padding:14px}#diskview-next .meta{gap:5px}#diskview-next .legend{gap:7px}#diskview-next .filetable th:nth-child(2){width:67px}#diskview-next .filetable th:nth-child(3){width:43px}#diskview-next .crumbs button{max-width:110px}#diskview-next .helpstrip{gap:7px}}
@media(prefers-reduced-motion:reduce){#diskview-next .track span{transition:none}}
</style>
<div class="app">
 <header class="titlebar"><span class="brand">◩ Disk View</span><span class="brand-sub muted">磁盘透视</span><span class="badge">交互模拟 · 合成数据</span><span class="spacer"></span><button id="nx-command" aria-label="打开命令面板 Ctrl+K">⌘ 操作</button><button id="nx-help" aria-label="快捷键帮助 F1">快捷键</button><button id="nx-theme">深色</button></header>
 <nav class="navline" aria-label="目录导航"><div class="history"><button id="nx-back" aria-label="后退 Alt+Left" title="后退 Alt+←">←</button><button id="nx-forward" aria-label="前进 Alt+Right" title="前进 Alt+→">→</button></div><div class="address"><div id="nx-crumbs" class="crumbs"></div><input id="nx-address" aria-label="目录地址" hidden><button id="nx-edit" class="plain" aria-label="编辑路径 Ctrl+L">编辑</button></div><button id="nx-rescan" class="primary">扫描设置</button></nav>
 <div class="meta"><span id="nx-source">完整结果 · NTFS 快速 / MFT</span><button id="nx-account" class="plain">逻辑大小 ⓘ</button><span class="spacer"></span><button id="nx-diagnostics" class="plain">扫描诊断</button><button id="nx-issues" class="plain">0 个读取问题</button></div>
 <div id="nx-banner" class="banner" hidden><span></span><button id="nx-error-detail">查看原因</button></div>
 <section id="nx-inspector" class="inspector" hidden aria-label="信息面板"></section>
 <section id="nx-progress" class="progressbox" hidden aria-label="扫描进度"><div class="progressline"><strong id="nx-engine"></strong><span class="spacer"></span><button id="nx-partial">查看本轮已发现</button><button id="nx-pause">暂停</button><button id="nx-cancel">取消</button></div><div class="progressline" style="margin-top:7px"><span id="nx-discovered" class="muted"></span><span class="spacer"></span><span id="nx-pool" class="tiny muted"></span></div><div id="nx-phases" class="phases"></div><div class="track"><span id="nx-meter"></span></div></section>
 <div class="heading"><button id="nx-parent" class="back-parent">↑ 返回 Downloads</button><div><h1 id="nx-heading">cern soc group</h1><small id="nx-total"></small></div><span class="spacer"></span><button id="nx-ancestors" class="plain">全部上级 ▾</button></div>
 <div class="mobile"><button id="nx-show-chart" aria-pressed="true">空间图</button><button id="nx-show-list" aria-pressed="false">目录列表</button></div>
 <div class="main">
  <section class="pane chartpane" aria-label="空间图"><div class="paneheader"><strong>空间分布</strong><span id="nx-focus-chart" class="focus-label">方向键选择</span><span class="spacer"></span><button id="nx-tiles" aria-pressed="true">方块</button><button id="nx-rings" aria-pressed="false">圆盘</button></div>
   <div class="charttools"><label class="tiny muted">层级 <select id="nx-depth" aria-label="显示层级"><option value="1">当前一层</option><option value="2">两层</option></select></label><span class="spacer"></span><button id="nx-zoom-out" aria-label="缩小图表">−</button><span id="nx-zoom" class="tiny">100%</span><button id="nx-zoom-in" aria-label="放大图表">＋</button><button id="nx-fit">适合窗口</button></div>
   <div id="nx-stage" class="stage" aria-label="可缩放和四向平移的空间图"><div id="nx-scene" class="scene"></div></div><div class="chartnav"><span>平移</span><div class="panpad" aria-label="四向平移，放大后可用"><button data-pan="up" aria-label="向上平移">↑</button><button data-pan="left" aria-label="向左平移">←</button><button id="nx-pan-home" class="pan-center" aria-label="平移归中">归中</button><button data-pan="right" aria-label="向右平移">→</button><button data-pan="down" aria-label="向下平移" style="grid-column:2">↓</button></div></div>
   <div class="legend"><span style="--tile:var(--green)"><i></i>目录</span><span style="--tile:var(--purple)"><i></i>视频</span><span style="--tile:var(--blue)"><i></i>文档</span><span style="--tile:var(--gold)"><i></i>压缩包</span><span class="spacer"></span><span>＋ 放大 · 空格拖动</span></div>

 const s={current:'cern',selected:'video-a',chart:'tiles',depth:1,list:'current',sort:'size',asc:false,query:'',page:0,focus:'chart',zoom:1,px:0,py:0,history:['cern'],historyIndex:0,pane:'chart',dark:null,trash:new Set(),excluded:new Set(),scan:null,source:'complete',failure:false,layout:[],menuNode:null,dialogReturn:null,clipboard:'',undo:[],pending:null,lastMode:'NTFS 快速 / MFT',scanFolder:null};

 const count=n=>s.trash.has(n.id)?0:n.children?n.children.reduce((a,c)=>a+count(c),0):s.source==='partial'&&!partialIds.has(n.id)?0:1;

 function toast(t){$('toast').textContent=t;}

 function remember(){if(applyingState)return;const snapshot={modelContent:{currentPath:cur().path,view:s.chart,focus:s.focus,ordinaryConcurrency:s.pending?.threads||'auto'},privateContent:{current:s.current,selected:s.selected,chart:s.chart,depth:s.depth,pane:s.pane,dark:s.dark}};lastSavedPrivate=JSON.stringify(snapshot.privateContent);try{window.openai?.setWidgetState?.(snapshot)?.catch(()=>{});}catch{}}
 function restore(value){const p=value?.privateContent;if(!p)return;if(nodes.has(p.current))s.current=p.current;if(nodes.has(p.selected))s.selected=p.selected;if(['tiles','rings'].includes(p.chart))s.chart=p.chart;if([1,2].includes(p.depth))s.depth=p.depth;if(['chart','list'].includes(p.pane))s.pane=p.pane;if(typeof p.dark==='boolean')s.dark=p.dark;s.history=[s.current];s.historyIndex=0;}
 restore(window.openai?.widgetState);
 function ancestors(n){const a=[];while(n){a.unshift(n);n=n.parent;}return a;}

 function go(id,replay=false){const n=nodes.get(id);if(!n?.children||s.trash.has(id))return;s.current=id;s.selected=kids(n)[0]?.id||null;s.query='';s.page=0;s.zoom=1;s.px=s.py=0;$('filter').value='';if(!replay&&s.history[s.historyIndex]!==id){s.history=s.history.slice(0,s.historyIndex+1);s.history.push(id);s.historyIndex=s.history.length-1;}closeMenu();hideTip();render();remember();}

 function applyPane(){root.dataset.pane=s.pane;$('show-chart').setAttribute('aria-pressed',s.pane==='chart');$('show-list').setAttribute('aria-pressed',s.pane==='list');$('focus-chart').textContent=s.focus==='chart'?'● 焦点 · ↑↓←→ 选择':'方向键选择';$('focus-list').textContent=s.focus==='list'?'● 焦点 · ↑↓ 选中':'↑↓ 选中 · → 进入';}
 function renderBreadcrumb(){let a=ancestors(cur());const limit=root.clientWidth<600?3:6;if(a.length>limit)a=[a[0],null,...a.slice(-(limit-1))];$('crumbs').innerHTML=a.map((n,i)=>(i?'<span>›</span>':'')+(n?'<button data-go="'+n.id+'" title="'+esc(n.path)+'">'+esc(n.name)+'</button>':'<button data-ancestors="true" aria-label="展开全部祖先目录">…</button>')).join('');$('back').disabled=s.historyIndex===0;$('forward').disabled=s.historyIndex>=s.history.length-1;$('parent').disabled=!cur().parent;$('parent').textContent=cur().parent?'↑ 返回 '+cur().parent.name:'已在扫描根 C:\\';$('ancestors').disabled=!cur().parent;}
 function partition(list,x,y,w,h,out,depth=0){if(!list.length)return;if(list.length===1){out.push({id:list[0].id,n:list[0],x,y,w,h,depth});return;}const total=list.reduce((a,n)=>a+size(n),0);let acc=0,k=0;for(;k<list.length-1;k++){acc+=size(list[k]);if(acc>=total/2)break;}k++;const ratio=total?acc/total:k/list.length;if(w>=h){partition(list.slice(0,k),x,y,w*ratio,h,out,depth);partition(list.slice(k),x+w*ratio,y,w*(1-ratio),h,out,depth);}else{partition(list.slice(0,k),x,y,w,h*ratio,out,depth);partition(list.slice(k),x,y+h*ratio,w,h*(1-ratio),out,depth);}}
 function arc(cx,cy,r0,r1,a0,a1){const point=(r,a)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];const a=point(r1,a0),b=point(r1,a1),c=point(r0,a1),d=point(r0,a0),large=a1-a0>Math.PI?1:0;return 'M '+a.join(' ')+' A '+r1+' '+r1+' 0 '+large+' 1 '+b.join(' ')+' L '+c.join(' ')+' A '+r0+' '+r0+' 0 '+large+' 0 '+d.join(' ')+' Z';}
 function renderChart(){
  const stage=$('stage'),w=stage.clientWidth,h=stage.clientHeight;if(!w)return;const scene=$('scene'),focused=scene.contains(document.activeElement)?document.activeElement.dataset.node:null;s.layout=[];const list=kids(cur()).sort((a,b)=>size(b)-size(a)).filter(n=>size(n)>0);
  if(s.chart==='tiles'){
   partition(list,0,0,w,h,s.layout);if(s.depth===2){const parents=s.layout.slice();for(const p of parents)if(p.n.children&&p.w>80&&p.h>85)partition(kids(p.n),p.x+3,p.y+28,p.w-6,p.h-31,s.layout,1);}
   scene.innerHTML=s.layout.map(r=>'<button class="tile" data-node="'+r.id+'" data-area="chart" aria-label="选择 '+esc(r.n.name)+'" style="--tile:'+color(r.n)+';left:'+r.x+'px;top:'+r.y+'px;width:'+Math.max(0,r.w)+'px;height:'+Math.max(0,r.h)+'px"><span>'+esc(r.n.name)+'</span>'+(r.w>55&&r.h>48?'<small>'+fmt(size(r.n))+'</small>':'')+'</button>').join('');
  }else{
   const cx=w/2,cy=h/2,R=Math.min(w,h)*.45,hole=R*.43,band=(R-hole)/s.depth;let paths='',labels='';
   const ring=(ns,r0,r1,start,end,depth)=>{const total=ns.reduce((a,n)=>a+size(n),0);let a=start;ns.forEach(n=>{const b=a+(total?size(n)/total:0)*(end-start),safe=Math.min(b,a+Math.PI*2-.00001);if(b>a){const mid=(a+b)/2,mr=(r0+r1)/2,x=cx+Math.cos(mid)*mr,y=cy+Math.sin(mid)*mr;s.layout.push({id:n.id,n,x:x-16,y:y-16,w:32,h:32,depth});paths+='<path data-node="'+n.id+'" data-area="chart" style="--tile:'+color(n)+'" d="'+arc(cx,cy,r0,r1,a,safe)+'"><title>'+esc(n.name)+' · '+fmt(size(n))+'</title></path>';if(b-a>.30)labels+='<button class="arc-label" data-node="'+n.id+'" data-area="chart" style="left:'+x+'px;top:'+y+'px;max-width:'+Math.min(110,(r1-r0)*.88)+'px" aria-label="选择 '+esc(n.name)+'">'+esc(n.children?n.name:fmt(size(n)))+'</button>';if(s.depth===2&&depth===0&&n.children)ring(kids(n),r1,r1+band,a,b,1);}a=b;});};
   ring(list,hole,hole+band,-Math.PI/2,Math.PI*1.5,0);
   scene.innerHTML='<svg class="sun" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="以逻辑大小为占比的平滑圆盘；中心返回父级">'+paths+'</svg>'+labels+'<button class="sun-parent" id="nx-center-parent" '+(!cur().parent?'disabled':'')+' aria-label="圆盘中心返回父级"><span>'+(cur().parent?'↑ 返回上一级':'扫描根')+'</span><small>'+esc(cur().parent?.name||cur().name)+'</small></button>';
  }

  $('tiles').setAttribute('aria-pressed',s.chart==='tiles');$('rings').setAttribute('aria-pressed',s.chart==='rings');transform();updateSelection();if(focused)scene.querySelector('button[data-node="'+focused+'"]')?.focus({preventScroll:true});

 function transform(){const w=$('stage').clientWidth,h=$('stage').clientHeight;s.px=Math.max(-(s.zoom-1)*w/2,Math.min((s.zoom-1)*w/2,s.px));s.py=Math.max(-(s.zoom-1)*h/2,Math.min((s.zoom-1)*h/2,s.py));$('scene').style.transform='translate('+s.px+'px,'+s.py+'px) scale('+s.zoom+')';$('zoom').textContent=Math.round(s.zoom*100)+'%';$('zoom-out').disabled=s.zoom<=1;$('zoom-in').disabled=s.zoom>=4;all('[data-pan]').forEach(b=>b.disabled=s.zoom<=1);$('pan-home').disabled=s.zoom<=1;}

 function renderRows(){const list=rows();s.page=Math.min(s.page,Math.max(0,Math.ceil(list.length/7)-1));const page=list.slice(s.page*7,s.page*7+7);$('rows').innerHTML=(cur().parent?'<tr class="parentrow"><td colspan="3"><button class="rowbutton" data-parent="true">↑ .. 返回 '+esc(cur().parent.name)+'</button></td></tr>':'')+page.map(n=>'<tr data-row="'+n.id+'"><td><button class="rowbutton" data-node="'+n.id+'" data-area="list" aria-label="选择 '+esc(n.name)+'"><i style="--tile:'+color(n)+'"></i><span>'+(n.children?'› ':'')+esc(n.name)+'</span></button></td><td>'+fmt(size(n))+'</td><td>'+share(n)+'</td></tr>').join('')+(!list.length?'<tr><td colspan="3" class="muted" style="padding:15px">没有匹配条目</td></tr>':'');$('list-count').textContent=list.length+' 项 · '+(s.page+1)+' / '+Math.max(1,Math.ceil(list.length/7));$('prev').disabled=s.page===0;$('next').disabled=(s.page+1)*7>=list.length;$('current').setAttribute('aria-pressed',s.list==='current');$('largest').setAttribute('aria-pressed',s.list==='largest');$('sort-name').textContent='名称'+(s.sort==='name'?(s.asc?' ↑':' ↓'):'');$('sort-size').textContent='大小'+(s.sort==='size'?(s.asc?' ↑':' ↓'):'');updateSelection();}

 let tipTimer=null;

  if(e.target===$('address')&&e.key==='Enter'){e.preventDefault();submitAddress();return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();editAddress();return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();s.pane='list';applyPane();$('filter').focus();return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette();return;}
  if(e.key==='F1'){e.preventDefault();help();return;}
  if(e.key==='F6'){e.preventDefault();focusArea(s.focus==='chart'?'list':'chart');return;}
  if(input)return;
  if(e.shiftKey&&e.key==='F10'||e.key==='ContextMenu'){e.preventDefault();const r=e.target.getBoundingClientRect();openMenu(sel(),r.left+10,r.bottom);return;}
  if(e.altKey&&['ArrowLeft','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();if(e.key==='ArrowUp')parent();else history(e.key==='ArrowLeft'?-1:1);return;}
  if(e.altKey&&e.key==='Enter'){e.preventDefault();properties();return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='c'){e.preventDefault();copyPath();return;}
  if(e.key==='F5'){e.preventDefault();scanSettings();return;}
  if(e.key==='Backspace'){e.preventDefault();parent();return;}
  if(e.key==='Delete'){e.preventDefault();recycle();return;}
  const onItem=e.target.closest('[data-node]');
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&onItem){e.preventDefault();direction(e.key,onItem.dataset.area||s.focus);return;}
  if(e.key==='Enter'&&onItem){e.preventDefault();enter();return;}
  if(['+','=','-','0'].includes(e.key)&&s.focus==='chart'){e.preventDefault();if(e.key==='0'){s.zoom=1;s.px=s.py=0;transform();}else zoom(e.key==='-'?-.25:.25);return;}
  if(e.code==='Space'&&s.focus==='chart'&&onItem){e.preventDefault();space=true;}
 });
 root.addEventListener('keyup',e=>{if(e.code==='Space')space=false;});window.addEventListener('blur',()=>{space=false;drag=null;$('scene').classList.remove('drag');});
