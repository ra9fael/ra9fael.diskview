<style>
#dv-prototype {

#dv-prototype .dv-banner {margin:0 16px 12px;padding:8px 12px;border-radius:5px;background:var(--dv-warnbg);color:var(--dv-warn);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#dv-prototype .dv-segment button[aria-pressed=true] {background:var(--dv-panel);color:var(--dv-accent);box-shadow:0 1px 3px #0001}

#dv-prototype .dv-chart {height:350px;position:relative;margin:0 10px 8px;min-width:0;isolation:isolate}
#dv-prototype .dv-tile {position:absolute;border:2px solid var(--dv-panel);background:var(--dv-doc);padding:8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;color:var(--dv-text);border-radius:4px}
#dv-prototype .dv-tile.dv-parent {padding:4px 8px;border-radius:4px}
#dv-prototype .dv-tile strong {font-size:13px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;width:100%;word-break:break-word;pointer-events:none}
#dv-prototype .dv-tile span {font-size:12px;opacity:.84;pointer-events:none;white-space:nowrap}
#dv-prototype .dv-tile.dv-small {padding:3px 5px}

#dv-prototype [data-kind=video] {--dv-fill:var(--dv-video)}
#dv-prototype [data-kind=dev] {--dv-fill:var(--dv-dev)}
#dv-prototype [data-kind=doc] {--dv-fill:var(--dv-doc)}
#dv-prototype [data-kind=archive] {--dv-fill:var(--dv-archive)}
#dv-prototype [data-kind=system] {--dv-fill:var(--dv-system)}
#dv-prototype [data-kind=other] {--dv-fill:var(--dv-other)}
#dv-prototype .dv-tile {background:var(--dv-fill)}
#dv-prototype .dv-tile.dv-hovered {filter:brightness(.96);outline:2px solid var(--dv-accent);outline-offset:-3px;z-index:5}
#dv-prototype .dv-tile.dv-selected {outline:3px solid var(--dv-accent);outline-offset:-4px}
#dv-prototype .dv-legend {display:flex;gap:12px;flex-wrap:wrap;padding:3px 12px 10px;color:var(--dv-sub);font-size:11px}
#dv-prototype .dv-legend span {display:inline-flex;align-items:center;gap:4px}
#dv-prototype .dv-swatch {background:var(--dv-fill);width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}

#dv-prototype .dv-table th:nth-child(3) {width:59px;text-align:right}

#dv-prototype .dv-table td {padding:0;border-bottom:1px solid color-mix(in srgb,var(--dv-line) 60%,transparent);height:var(--dv-row,37px);font-variant-numeric:tabular-nums}

#dv-prototype .dv-namecell {display:flex;gap:7px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;min-height:var(--dv-row,37px)}
#dv-prototype .dv-namecell span:last-child {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#dv-prototype .dv-rowicon {color:var(--dv-sub);flex:none;font-size:12px}
#dv-prototype .dv-listfoot {display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:11px;color:var(--dv-sub);flex-wrap:wrap}
#dv-prototype .dv-detail {display:flex;align-items:flex-start;gap:12px;margin:12px 16px 0;padding:12px;background:var(--dv-panel);border:1px solid var(--dv-line);border-radius:6px}

#dv-prototype .dv-detailtop strong {font-weight:600;overflow-wrap:anywhere}
#dv-prototype .dv-detailpath {font-size:12px;color:var(--dv-sub);overflow-wrap:anywhere;margin-top:3px}
#dv-prototype .dv-detailnumbers {display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12px}
#dv-prototype .dv-detailactions {display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
#dv-prototype .dv-status {display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:11px;color:var(--dv-sub);min-height:34px}
#dv-prototype .dv-statuspath {flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dv-prototype .dv-mobile {display:none}

#dv-prototype .dv-sun {width:100%;height:100%;overflow:visible}
#dv-prototype .dv-sun path {stroke:var(--dv-panel);stroke-width:2px;fill:var(--dv-fill);cursor:pointer}
#dv-prototype .dv-sun path.dv-selected,#dv-prototype .dv-sun path.dv-hovered {stroke:var(--dv-accent);stroke-width:3px}
#dv-prototype .dv-sun text {fill:var(--dv-text);font-family:inherit;text-anchor:middle;pointer-events:none}
#dv-prototype .dv-sun .dv-sun-name {font-size:14px;font-weight:600}
#dv-prototype .dv-sun .dv-sun-size {font-size:22px;font-weight:600}
#dv-prototype .dv-sun .dv-sun-hint {font-size:11px;fill:var(--dv-sub)}
#dv-prototype .dv-overlay {position:absolute;inset:0;background:#0c152551;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:85px 16px 20px;border-radius:10px}
#dv-prototype .dv-dialog {background:var(--dv-panel);color:var(--dv-text);border:1px solid var(--dv-line);border-radius:9px;padding:22px;width:470px;max-width:100%;box-shadow:0 15px 45px #0003}
#dv-prototype .dv-dialog h2 {font-size:18px;font-weight:600;margin:8px 0}

</style>

    }).join("")||'<tr><td colspan="3"><div class="dv-empty" style="height:110px">'+(state.filter?"没有匹配的条目":"暂无条目")+'</div></td></tr>';
    el("page").textContent=(state.page+1)+"/"+pages;el("prev-page").disabled=state.page===0;el("next-page").disabled=state.page===pages-1;
    el("list-note").textContent=state.group?"当前仅列出聚合的小项":state.list==="largest"?"本范围内的示例文件 · 不限于本层":"双击文件夹进入";
    el("sort-name").textContent="名称"+(state.sort==="name"?(state.ascending?" ↑":" ↓"):"");
    el("sort-size").textContent="大小"+(state.sort==="size"?(state.ascending?" ↑":" ↓"):"");
    paintSelection();
  }
  function renderDetail(){
    const selected=node(state.selected),n=selected||current();
    el("detail-type").textContent=selected?"已选中 · "+typeName(n):"当前目录";
    el("detail-name").textContent=n.name;el("detail-path").textContent=n.path;
    el("detail-numbers").innerHTML=n.type==="blocked"?'<span>大小未知 · 访问被拒绝</span>':'<span><b>'+fmt(size(n))+'</b> 逻辑大小</span><span>占当前范围 '+share(n)+'</span><span>'+count(n.count*(activePartial()&&n.bytes?size(n)/n.bytes:1))+' 个文件'+(activePartial()?"（已发现，模拟）":"")+'</span>';
    el("enter").disabled=!selected||!["dir","group"].includes(n.type)||n.id===state.current;
    el("enter").textContent=n.type==="group"?"展开这些条目":"进入文件夹";
    el("locate").disabled=!selected||!n.parent;
  }
  function paintSelection(){
    app.querySelectorAll("[data-node]").forEach(function(target){
      target.classList.toggle("dv-selected",target.dataset.node===state.selected);
      target.classList.toggle("dv-hovered",target.dataset.node===state.hover&&state.hover!==state.selected);
      if(target.tagName==="BUTTON")target.setAttribute("aria-pressed",target.dataset.node===state.selected);
    });
  }
  function status(){
    const n=node(state.hover)||node(state.selected);
    el("hover-status").textContent=n?n.path+" · "+(n.type==="blocked"?"无法读取":fmt(size(n))+" · "+share(n)):"悬停查看完整路径；单击后详情保持";
  }
  function positionTooltip(){
    if(!lastPointer)return;const r=app.getBoundingClientRect(),tip=el("tooltip");
    let x=lastPointer.x-r.left+16,y=lastPointer.y-r.top+18;
    x=Math.max(10,Math.min(x,r.width-tip.offsetWidth-10));
    if(y+tip.offsetHeight>r.height-10)y=lastPointer.y-r.top-tip.offsetHeight-12;
    tip.style.left=x+"px";tip.style.top=Math.max(10,y)+"px";
  }
  function hover(n,e){
    lastPointer={x:e.clientX,y:e.clientY};
    if(state.hover===n.id){positionTooltip();return;}
    clearTimeout(hoverTimer);el("tooltip").hidden=true;state.hover=n.id;paintSelection();status();
    hoverTimer=setTimeout(function(){
      if(state.hover!==n.id)return;
      el("tooltip").innerHTML='<strong>'+esc(n.name)+'</strong><div class="dv-tip-path">'+esc(n.path)+'</div><div class="dv-tip-grid"><span>'+typeName(n)+'<br><b>'+(n.type==="blocked"?"未知":fmt(size(n)))+'</b></span><span>占当前范围<br><b>'+share(n)+'</b></span></div><div class="dv-tip-hint">'+(n.type==="dir"?"单击固定详情 · 双击进入文件夹":n.type==="group"?"单击查看汇总 · 双击在列表展开":"单击固定详情 · 定位到所在目录")+'</div>';
      el("tooltip").hidden=false;positionTooltip();
    },settings.hoverDelay);
  }
  app.addEventListener("pointermove",function(e){
    const target=e.target.closest("[data-node]");if(target&&app.contains(target)&&node(target.dataset.node))hover(node(target.dataset.node),e);
    else if(state.hover)resetHover();
  });
  app.addEventListener("pointerleave",resetHover);
  app.addEventListener("focusin",function(e){const t=e.target.closest("button[data-node]");if(t){const r=t.getBoundingClientRect();hover(node(t.dataset.node),{clientX:r.left+r.width/2,clientY:r.bottom});}});
  app.addEventListener("click",function(e){
    const nav=e.target.closest("[data-nav]");if(nav){navigate(nav.dataset.nav);return;}
    const target=e.target.closest("[data-node]");if(target){select(target.dataset.node);return;}
    const action=e.target.closest("[data-action]");if(action)modalAction(action.dataset.action);
  });
  app.addEventListener("dblclick",function(e){const t=e.target.closest("[data-node]");if(t){e.preventDefault();openNode(t.dataset.node);}});
  function render(){renderNav();renderList();renderChart();renderDetail();status();renderProgress();}
  function dialogMarkup(kind){
    if(kind==="permission")return '<span class="dv-badge">按需授权 · 原型演示</span><h2>用快速模式扫描 '+esc(root().path)+'？</h2><p>仅扫描助手请求管理员权限，读取此 NTFS 卷的文件元数据。主界面保持普通权限。</p><ul><li>只读取名称、目录关系和大小，不读取文件内容。</li><li>任务结束后助手退出，不安装常驻服务。</li><li>拒绝授权后可继续普通扫描。</li></ul><div class="dv-notice">这是交互模拟，不会弹出真实 Windows 授权窗口。真实速度需要另行测试。</div><div class="dv-dialogactions"><button class="dv-btn" data-action="close">取消</button><button class="dv-btn" data-action="start-normal">不授权，普通扫描</button><button class="dv-btn dv-primary" data-action="start-fast">模拟授权并扫描</button></div>';
    if(kind==="issues")return '<span class="dv-badge">扫描覆盖范围</span><h2>3 个位置无法读取</h2><p>扫描已结束，但这些位置的大小未计入结果；未知大小不代表零占用。</p><ul><li>C:\\System Volume Information — 访问被拒绝</li><li>C:\\Recovery\\WindowsRE — 访问被拒绝</li><li>C:\\ProgramData\\受保护数据 — 目录已变化</li></ul><p>目录链接与跨卷挂载点不继续跟随，避免重复统计。快速模式也不保证覆盖全部受保护数据。</p><div class="dv-dialogactions"><button class="dv-btn dv-primary" data-action="close">知道了</button></div>';
    return '<span class="dv-badge">统计口径 · 原型使用逻辑大小</span><h2>这些数字为什么不同？</h2><p><strong>逻辑大小：</strong>文件声明的长度，本图按这个值分配面积。</p><p><strong>占用空间：</strong>实际分配的磁盘空间。压缩、稀疏文件、硬链接都会影响它；按簇取整只能标为近似。</p><p><strong>磁盘已用：</strong>还包含文件系统元数据和未读取区域，不能直接当作文件扫描总量。</p><div class="dv-notice">未完成结果的占比以“本轮已发现内容”为分母；它不是磁盘扫描完成百分比。</div><div class="dv-dialogactions"><button class="dv-btn dv-primary" data-action="close">知道了</button></div>';
  }
  let pendingFirst=false,pendingFail=false;
  function showDialog(kind){
    resetHover();modalReturn=document.activeElement;el("overlay").innerHTML='<section class="dv-dialog" role="dialog" aria-modal="true" aria-label="'+(kind==="permission"?"快速扫描权限演示":kind==="issues"?"无法读取的位置":"统计口径")+'">'+dialogMarkup(kind)+'</section>';el("overlay").hidden=false;
    el("overlay").querySelector("button").focus();
  }
  function closeDialog(){el("overlay").hidden=true;el("overlay").innerHTML="";if(modalReturn&&modalReturn.isConnected)modalReturn.focus();}
  function modalAction(action){
    if(action==="close"){closeDialog();return;}
    if(action==="start-fast"||action==="start-normal"){closeDialog();beginScan(action==="start-fast"?"fast":"normal",pendingFirst,pendingFail);}
  }
  function requestScan(first,fail){
    if(state.scan)return;pendingFirst=!!first;pendingFail=!!fail;
    if(current().drive==="e"){beginScan("normal",first,fail);notify("E: 为 exFAT，自动使用普通目录扫描（模拟）。");}
    else showDialog("permission");
  }
  function buildPartial(fraction){
    state.partial.clear();
    const leaves=[];function walk(n){if(n.children)n.children.forEach(walk);else if(n.type!=="blocked")leaves.push(n);}
    walk(root());const discovered=Math.floor(leaves.length*fraction);
    leaves.forEach(function(n,i){state.partial.set(n.id,i<discovered?n.bytes:0);});
    function sum(n){if(n.children)state.partial.set(n.id,n.children.reduce(function(a,c){return a+sum(c);},0));return state.partial.get(n.id)||0;}
    sum(root());
  }
  function beginScan(engine,first,fail){
    clearInterval(scanTimer);resetHover();
    if(first){state.hasComplete=false;state.current=root().id;state.selected=null;state.history=[state.current];state.historyIndex=0;state.filter="";el("filter").value="";state.page=0;state.group=null;}
    state.source=first?"partial":"complete";state.partial.clear();state.banner="";
    state.scan={engine:engine,started:performance.now(),fraction:0,fail:!!fail,lastPaint:0};
    render();notify(first?"首次扫描演示：发现的条目逐步可浏览。":"更新扫描演示：可以继续浏览上次完成结果。");
    scanTimer=setInterval(function(){
      const s=state.scan;if(!s)return;const elapsed=performance.now()-s.started;s.fraction=Math.min(1,elapsed/10000);
      buildPartial(Math.min(1,s.fraction/0.8));
      if(s.fail&&s.fraction>.45){endScan("failed");return;}
      if(s.fraction>=1){endScan("complete");return;}
      renderProgress();
      if(activePartial()&&elapsed-s.lastPaint>700){s.lastPaint=elapsed;render();}
    },180);
  }
  function endScan(reason){
    clearInterval(scanTimer);scanTimer=null;state.scan=null;resetHover();
    if(reason==="complete"){state.hasComplete=true;state.source="complete";state.latest="14:33";state.banner="快照已更新。"+(current().drive==="c"?"仍有 3 个位置未读取，可查看问题详情。":"");notify("模拟扫描完成，当前浏览位置已保留。");}
    else {state.source=state.hasComplete?"complete":"partial";state.banner=(reason==="failed"?"更新失败：扫描助手连接中断（模拟）。":"扫描已取消。")+(state.hasComplete?"已保留上次完成结果。":"仅保留已发现的局部结果。");notify(reason==="failed"?"可以重新扫描；旧快照没有被失败的结果覆盖。":"取消成功，当前数据来源已标明。");}
    render();
  }
  function renderProgress(){
    const s=state.scan;el("progress").hidden=!s;if(!s)return;
    const f=s.fraction,stage=f<.65?0:f<.85?1:2;
    el("phase").textContent=(s.engine==="fast"?["读取文件记录","汇总文件大小","构建目录视图"]:["枚举目录","汇总已发现大小","构建目录视图"])[stage]+" · "+root().path;
    el("engine").textContent=s.engine==="fast"?"NTFS 快速模式（模拟）":"普通扫描（模拟）";
    el("progress-stats").textContent="已发现 "+count(root().count*Math.min(1,f/.8))+" 个文件 · 阶段 "+(stage+1)+"/3";
    el("progress-time").textContent=((performance.now()-s.started)/1000).toFixed(1)+" s · 演示";
    el("progress-path").textContent=stage===0?(s.engine==="fast"?"正在读取索引记录，尚无可靠剩余时间":"当前目录："+root().path+"…"):"正在整理已发现条目";
    el("track").classList.toggle("dv-unknown",stage===0);
    el("track").firstElementChild.style.width=stage===1?((f-.65)/.2*100)+"%":stage===2?((f-.85)/.15*100)+"%":"22%";
    el("scan-view").hidden=!state.hasComplete;el("scan-view").textContent=activePartial()?"查看上次完成结果":"查看本轮已发现";
  }
  function changeDrive(d){
    if(state.scan)endScan("cancelled");
    state.current=drives[d].id;state.hasComplete=true;state.source="complete";state.partial.clear();state.banner="";state.latest="14:32";state.selected=null;state.history=[state.current];state.historyIndex=0;state.filter="";state.page=0;state.group=null;el("filter").value="";
    render();save();
  }
  el("back").onclick=function(){historyStep(-1);};el("forward").onclick=function(){historyStep(1);};el("up").onclick=up;
  el("edit-address").onclick=editAddress;
  el("address-input").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submitAddress();}if(e.key==="Escape"){endAddress();el("patherror").hidden=true;}});
  el("drive").onchange=function(e){changeDrive(e.target.value);};
  el("rescan").onclick=function(){requestScan(false,false);};
  el("issues").onclick=function(){showDialog("issues");};el("accounting").onclick=function(){showDialog("accounting");};
  el("cancel").onclick=function(){endScan("cancelled");};
  el("scan-view").onclick=function(){state.source=activePartial()?"complete":"partial";resetHover();render();};
  el("treemap").onclick=function(){state.mode="treemap";resetHover();render();save();};
  el("sunburst").onclick=function(){state.mode="sunburst";resetHover();render();save();};
  el("depth").onchange=function(e){state.depth=Number(e.target.value);resetHover();renderChart();save();};
  el("current-list").onclick=function(){state.list="current";state.group=null;state.page=0;render();save();};
  el("largest-list").onclick=function(){state.list="largest";state.group=null;state.page=0;render();save();};
  el("filter").oninput=function(e){state.filter=e.target.value;state.page=0;renderList();};
  el("clear-filter").onclick=function(){state.filter="";state.group=null;el("filter").value="";state.page=0;renderList();};
  function sortBy(key){state.ascending=state.sort===key?!state.ascending:key==="name";state.sort=key;state.page=0;renderList();}
  el("sort-name").onclick=function(){sortBy("name");};el("sort-size").onclick=function(){sortBy("size");};
  el("prev-page").onclick=function(){state.page=Math.max(0,state.page-1);renderList();};
  el("next-page").onclick=function(){state.page++;renderList();};
  el("enter").onclick=function(){if(state.selected)openNode(state.selected);};
  el("locate").onclick=function(){const n=node(state.selected);if(n&&n.parent){navigate(n.parent.id);select(n.id);state.mobile="chart";render();notify("已定位 "+n.path);}};
  el("show-chart").onclick=function(){state.mobile="chart";render();};
  el("show-list").onclick=function(){state.mobile="list";render();};
  el("theme").onclick=function(){const dark=state.theme==="dark"||(state.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);state.theme=dark?"light":"dark";render();save();};
  el("demo-first").onclick=function(){requestScan(true,false);};
  el("demo-normal").onclick=function(){beginScan("normal",false,false);};
  el("demo-error").onclick=function(){beginScan("fast",false,true);};
  el("demo-reset").onclick=function(){clearInterval(scanTimer);scanTimer=null;state.scan=null;closeDialog();changeDrive("c");state.mode="treemap";state.depth=1;state.list="current";state.mobile="chart";el("patherror").hidden=true;notify("已回到合成的示例结果。");render();};
  app.addEventListener("keydown",function(e){
    if(!el("overlay").hidden){
      if(e.key==="Escape"){e.preventDefault();closeDialog();}
      if(e.key==="Tab"){const buttons=Array.from(el("overlay").querySelectorAll("button"));const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
      return;
    }
    const input=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if(e.ctrlKey&&e.key.toLowerCase()==="l"){e.preventDefault();editAddress();return;}
    if(input)return;
    if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();historyStep(-1);}
    else if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();historyStep(1);}
    else if(e.key==="Backspace"||(e.altKey&&e.key==="ArrowUp")){e.preventDefault();up();}
    else if(e.key==="Escape"){resetHover();}
    else if(e.key==="Enter"){const t=e.target.closest("[data-node]");if(t){e.preventDefault();openNode(t.dataset.node);}}
  });
  let dragging=false;
  el("divider").addEventListener("pointerdown",function(e){dragging=true;e.currentTarget.setPointerCapture(e.pointerId);resetHover();});
  el("divider").addEventListener("pointermove",function(e){if(!dragging)return;const r=el("main").getBoundingClientRect(),ratio=Math.max(.38,Math.min(.69,(e.clientX-r.left)/r.width));el("main").style.gridTemplateColumns="minmax(0,"+ratio+"fr) 7px minmax(260px,"+(1-ratio)+"fr)";});
  el("divider").addEventListener("pointerup",function(){dragging=false;});
  el("divider").addEventListener("lostpointercapture",function(){dragging=false;});
  let lastWidth=0;
  new ResizeObserver(function(entries){const w=entries[0].contentRect.width;if(Math.abs(w-lastWidth)>1){lastWidth=w;renderChart();}}).observe(el("chart"));
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addSelect(settings,"density",{label:"列表密度",options:["标准","紧凑"]});tweak.addSlider(settings,"hoverDelay",{label:"悬停提示延迟",min:100,max:600,step:50,unit:"ms"});}
})();
</script>
</main></body></html>
