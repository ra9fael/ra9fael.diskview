<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Disk View QML layout and bidirectional selection proposal</title>
  <desc>Design draft for the QML disk view. All panes, including tree, file and extension views, can be docked or maximized independently. Column configuration is in each panel header, and tree and visualization selection are synchronized in both directions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3c78b5"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b969f"/>
    </marker>
    <style>
      .window { fill:#f7f8f9; stroke:#b8c0c7; stroke-width:1; }
      .bar { fill:#ffffff; stroke:#d4d9de; stroke-width:1; }
      .panel { fill:#ffffff; stroke:#c8cfd5; stroke-width:1; }
      .toolbar { fill:#f5f6f7; stroke:#d4d9de; stroke-width:1; }
      .muted { fill:#68747d; font-family:"Segoe UI",sans-serif; font-size:13px; }
      .text { fill:#26323a; font-family:"Segoe UI",sans-serif; font-size:14px; }
      .small { fill:#68747d; font-family:"Segoe UI",sans-serif; font-size:12px; }
      .title { fill:#26323a; font-family:"Segoe UI",sans-serif; font-size:15px; font-weight:600; }
      .heading { fill:#26323a; font-family:"Segoe UI",sans-serif; font-size:22px; font-weight:600; }
      .note { fill:#315d83; font-family:"Segoe UI",sans-serif; font-size:13px; }
      .icon { fill:none; stroke:#52616b; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .selected { fill:#e7f1fb; stroke:#78a9d5; stroke-width:1; }
      .accent { fill:#3c78b5; }
      .guide { fill:none; stroke:#3c78b5; stroke-width:2; marker-end:url(#arrow); }
      .guideBack { fill:none; stroke:#8b969f; stroke-width:2; stroke-dasharray:5 4; marker-end:url(#arrowMuted); }
      .callout { fill:#edf5fc; stroke:#9bbddd; stroke-width:1; }
      .badge { fill:#eaf2f8; stroke:#9bbddd; stroke-width:1; }
    </style>
  </defs>

  <!-- Window frame -->
  <rect x="20" y="20" width="1400" height="860" rx="3" class="window"/>
  <rect x="20" y="20" width="1400" height="34" class="bar"/>
  <text x="42" y="42" class="title">磁盘透视</text>
  <text x="1350" y="42" class="small">—  □  ×</text>

  <!-- Top toolbar is grouped by task; controls share a 28px height and center line. -->
  <rect x="36" y="68" width="1368" height="46" rx="2" class="toolbar"/>
  <rect x="48" y="77" width="88" height="28" rx="3" class="bar"/>
  <text x="61" y="96" class="text">C: (C:)</text>
  <path d="M126 88 l5 5 -5 5" class="icon"/>
  <rect x="146" y="77" width="432" height="28" rx="3" class="bar"/>
  <text x="160" y="96" class="text">扫描范围：C:\</text>
  <rect x="584" y="77" width="36" height="28" rx="3" class="bar"/>
  <path d="M594 87 h16 v12 h-16 z M596 85 h8 l2 2" class="icon"/>
  <line x1="634" y1="77" x2="634" y2="105" stroke="#c5ccd2"/>
  <rect x="650" y="77" width="104" height="28" rx="3" class="bar"/>
  <text x="666" y="96" class="text">重新扫描</text>
  <rect x="762" y="77" width="104" height="28" rx="3" class="bar"/>
  <text x="778" y="96" class="text">扫描问题</text>
  <rect x="874" y="77" width="104" height="28" rx="3" class="bar"/>
  <text x="890" y="96" class="text">扫描设置</text>
  <line x1="994" y1="77" x2="994" y2="105" stroke="#c5ccd2"/>
  <rect x="1010" y="77" width="104" height="28" rx="3" class="bar"/>
  <text x="1026" y="96" class="text">主题设置</text>
  <line x1="1130" y1="77" x2="1130" y2="105" stroke="#c5ccd2"/>
  <rect x="1146" y="77" width="104" height="28" rx="3" class="bar"/>
  <text x="1162" y="96" class="text">层级 自动</text>
  <rect x="1258" y="77" width="142" height="28" rx="3" class="bar"/>
  <text x="1274" y="96" class="text">布局 自由 Dock⌄</text>

  <!-- Visualization header: breadcrumb is the sole flexible item. -->
  <rect x="36" y="126" width="1368" height="42" class="bar"/>
  <rect x="48" y="133" width="30" height="28" rx="3" class="bar"/>
  <path d="M66 153 l-8 -8 8 -8 M58 145 h16" class="icon"/>
  <text x="92" y="151" class="text">C:\  ›  …  ›  下载</text>
  <rect x="1330" y="133" width="56" height="28" rx="3" class="bar"/>
  <text x="1344" y="151" class="text">编辑</text>

  <!-- Default layout: one top dock contains all three list panes; visualization is full-width below. -->
  <rect x="36" y="180" width="1368" height="300" class="panel"/>
  <rect x="36" y="180" width="1368" height="36" class="bar"/>
  <text x="52" y="203" class="title">默认 Dock</text>
  <rect x="162" y="186" width="118" height="24" rx="3" class="selected"/>
  <text x="184" y="203" class="text">树视图</text>
  <rect x="282" y="186" width="118" height="24" rx="3" class="bar"/>
  <text x="304" y="203" class="muted">文件视图</text>
  <rect x="402" y="186" width="132" height="24" rx="3" class="bar"/>
  <text x="420" y="203" class="muted">扩展名视图</text>
  <text x="1060" y="203" class="note">三者默认同 Dock · 可拖拽分离</text>
  <rect x="1300" y="186" width="30" height="24" rx="3" class="bar"/>
  <path d="M1307 192 h16 M1307 197 h16 M1307 202 h16" class="icon"/>
  <rect x="1338" y="186" width="28" height="24" rx="3" class="bar"/>
  <path d="M1345 192 h14 M1345 197 h14 M1345 202 h14" class="icon"/>
  <rect x="1372" y="186" width="28" height="24" rx="3" class="bar"/>
  <path d="M1379 191 h14 v14 h-14 z M1382 194 h8 v8 h-8 z" class="icon"/>
  <rect x="48" y="226" width="1344" height="238" class="toolbar"/>
  <text x="66" y="251" class="muted">名称</text><text x="1170" y="251" class="muted">大小</text><text x="1270" y="251" class="muted">属性</text>
  <rect x="56" y="262" width="1328" height="32" class="selected"/>
  <text x="72" y="284" class="text">▾  下载</text><text x="1164" y="284" class="text">134 GB</text><text x="1274" y="284" class="text">目录</text>
  <text x="72" y="320" class="text">   文档</text><text x="1164" y="320" class="text">31 GB</text>
  <text x="72" y="356" class="text">   图片</text><text x="1164" y="356" class="text">18 GB</text>
  <text x="72" y="392" class="text">   视频</text><text x="1164" y="392" class="text">85 GB</text>
  <rect x="990" y="416" width="394" height="30" rx="3" class="callout"/>
  <text x="1004" y="436" class="note">列配置在标题栏 · ⛶ 最大化当前标签</text>

  <rect x="36" y="492" width="1368" height="318" class="panel"/>
  <rect x="36" y="492" width="1368" height="36" class="bar"/>
  <path d="M57 516 h13 M60 512 l4 -5 4 5" class="icon"/>
  <text x="80" y="515" class="title">可视化视图</text>
  <text x="1060" y="515" class="note">与上方三个列表双向同步选中</text>
  <rect x="1290" y="498" width="30" height="24" rx="3" class="bar"/><path d="M1297 504 h16 M1297 509 h16 M1297 514 h16" class="icon"/>
  <rect x="1330" y="498" width="30" height="24" rx="3" class="bar"/><path d="M1337 503 h16 M1337 509 h16 M1337 515 h16" class="icon"/>
  <rect x="1368" y="498" width="30" height="24" rx="3" class="bar"/><path d="M1375 503 h16 v16 h-16 z M1379 507 h8 v8 h-8 z" class="icon"/>
  <rect x="52" y="538" width="1336" height="256" fill="#f1f4f6" stroke="#d4dce2"/>
  <rect x="62" y="548" width="480" height="126" fill="#6787bd"/>
  <rect x="548" y="548" width="310" height="92" fill="#ba6590"/>
  <rect x="864" y="548" width="514" height="92" fill="#66a9b2"/>
  <rect x="62" y="680" width="300" height="104" fill="#a9c46c"/>
  <rect x="368" y="646" width="430" height="138" fill="#c9a467"/>
  <rect x="808" y="646" width="570" height="138" fill="#9d75c3"/>
  <rect x="548" y="554" width="298" height="80" class="selected" opacity="0.55"/>
  <text x="78" y="572" fill="#ffffff" font-family="Segoe UI,sans-serif" font-size="14">用户</text>
  <text x="566" y="578" fill="#26323a" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600">下载 · 已选中</text>
  <text x="566" y="600" class="small">C:\用户\renfei\下载</text>
  <rect x="570" y="616" width="116" height="26" rx="3" class="badge"/><text x="585" y="634" class="note">列表同步高亮</text>

  <!-- Bidirectional selection relationship -->
  <path d="M780 634 C820 620 850 620 890 634" class="guide"/>
  <path d="M890 654 C850 668 820 668 780 654" class="guideBack"/>
  <text x="792" y="616" class="small">列表 → 图表</text>
  <text x="792" y="690" class="small">图表 → 列表</text>

  <!-- Bottom filter / status area -->
  <rect x="36" y="824" width="1368" height="40" class="bar"/>
  <text x="52" y="849" class="muted">已选中：下载</text>
  <line x1="164" y1="832" x2="164" y2="856" stroke="#d4d9de"/>
  <text x="180" y="849" class="muted">C:\用户\renfei\下载</text>
  <line x1="520" y1="832" x2="520" y2="856" stroke="#d4d9de"/>
  <text x="536" y="849" class="muted">当前目录 883 GB · 5,373,553 项</text>
  <line x1="1000" y1="832" x2="1000" y2="856" stroke="#d4d9de"/>
  <text x="1016" y="849" class="muted">选中项 134 GB</text>
  <text x="1192" y="849" class="muted">占比 15.2%</text>
  <line x1="1320" y1="832" x2="1320" y2="856" stroke="#d4d9de"/>
  <text x="1336" y="849" class="muted">就绪</text>

  <!-- Legend -->
  <rect x="42" y="870" width="14" height="8" fill="#3c78b5"/>
  <text x="62" y="879" class="small">蓝色描边：当前选中</text>
  <line x1="190" y1="875" x2="230" y2="875" class="guide"/>
  <text x="240" y="879" class="small">同步方向</text>
  <text x="360" y="879" class="small">稿件重点：目录统计移至底部状态栏；长工具栏按扫描位置、扫描动作、外观、布局分组并用分隔线隔开</text>
</svg>
