name: native-verification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch or SHA to verify'
        type: string
        required: true
      publish:
        description: 'Reserved; native verification never publishes'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.publish == false
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package
        run: python tools/package.py
